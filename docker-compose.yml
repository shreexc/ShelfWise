services:
  mongo:
    image: mongo:7.0
    container_name: library-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - library-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/library_system}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CLIENT_URL: ${CLIENT_URL:-*}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - library-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: library-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - library-network

volumes:
  mongo_data:
    driver: local

networks:
  library-network:
    driver: bridge
